<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estienne 1550 — scan vs HTML recreation overlay</title>
<!-- t_b16a2c44 · Phase 2.4 comparison harness.
     Left: source scan (PD, Wikimedia Commons Gospel_Estienne_1550.jpg).
     Right: rendered HTML recreation (estienne-render.png, regenerated by
     tools/render_estienne_overlay.py). Drag the opacity slider, or switch to
     overlay mode and move/scale the render over the scan for the ±½-line
     line-break check. -->
<style>
  body { margin:0; font:14px Georgia, serif; background:#231d12; color:#e8ddc0; }
  .bar { position:sticky; top:0; background:#15100a; padding:.6rem 1rem; display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
  .bar label { display:flex; gap:.4rem; align-items:center; }
  .wrap { display:flex; gap:1rem; padding:1rem; align-items:flex-start; }
  .pane { position:relative; }
  .pane img { display:block; max-width:100%; height:auto; }
  .pane h2 { font-size:.85rem; font-weight:normal; color:#b99f6c; margin:.2rem 0; }
  .overlay .render { position:absolute; top:84px; left:33px; width:740px; opacity:.5; cursor:grab; }
  .split { flex:1; min-width:0; }
  .split img { width:100%; }
</style>
</head>
<body>
<div class="bar">
  <strong>Estienne 1550, fol. 161 — comparison</strong>
  <label>overlay mode <input type="checkbox" id="mode"></label>
  <label>opacity <input type="range" id="op" min="0" max="100" value="50" style="width:120px"></label>
  <span id="pos" style="color:#b99f6c"></span>
  <a href="estienne-john1.html" style="color:#cfa94f">open live page</a>
</div>
<div class="wrap" id="wrap">
  <div class="pane split">
    <h2>source scan (Public domain, Wikimedia Commons)</h2>
    <img id="scan" src="estienne-scan.jpg" alt="scan of Estienne 1550 John 1 page">
  </div>
  <div class="pane split">
    <h2>HTML recreation (rendered Chromium)</h2>
    <img id="render" class="render" src="estienne-render.png" alt="render of the HTML recreation">
  </div>
</div>
<script>
const render = document.getElementById('render'), op = document.getElementById('op');
const mode = document.getElementById('mode'), wrap = document.getElementById('wrap'), pos = document.getElementById('pos');
op.addEventListener('input', () => render.style.opacity = op.value/100);
mode.addEventListener('change', () => {
  if (mode.checked) {
    const scan = document.getElementById('scan');
    scan.parentNode.appendChild(render);
    render.classList.add('render');
    render.style.opacity = op.value/100;
    render.style.position = 'absolute';
    render.style.top = '84px'; render.style.left = '33px'; render.style.width = '740px';
    render._drag = true;
  } else {
    wrap.children[1].appendChild(render);
    render.style.position = 'static'; render.classList.remove('render');
  }
});
let drag = null;
render.addEventListener('mousedown', e => { if (render._drag) { drag = [e.clientX - render.offsetLeft, e.clientY - render.offsetTop]; e.preventDefault(); } });
window.addEventListener('mousemove', e => { if (drag) { render.style.left = (e.clientX - drag[0]) + 'px'; render.style.top = (e.clientY - drag[1]) + 'px'; pos.textContent = `x:${render.offsetLeft} y:${render.offsetTop} w:${render.clientWidth}`; } });
window.addEventListener('mouseup', () => drag = null);
render.addEventListener('wheel', e => { if (render._drag) { const w = render.clientWidth + (e.deltaY < 0 ? 10 : -10); render.style.width = Math.max(200, w) + 'px'; e.preventDefault(); } });
</script>
</body>
</html>
